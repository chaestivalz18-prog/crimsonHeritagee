<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CRIMSON HERITAGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg: #080808;
      --panel: rgba(18,18,18,.88);
      --panel2: rgba(28,28,28,.72);
      --red: #b5121b;
      --red2: #e32631;
      --gold: #c9a45c;
      --text: #f5f5f5;
      --muted: #929292;
      --border: rgba(255,255,255,.08);
      --green: #37c978;
      --yellow: #e5b94d;
      --danger: #ef4d5a;
      --sidebar: 250px;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #5d5d5d transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ==================================================
       BACKGROUND - CRIMSON STAR WATERMARK
    ================================================== */

    body {
      position: relative;
      background: #050505;
    }

    /* Logo/bintang merah besar di belakang dashboard.
       mix-blend-mode: screen membuat bagian hitam dari gambar
       menyatu dengan background sehingga yang menonjol adalah emblemnya. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff3340%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237b0710%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2244%22%20fill%3D%22%23090909%22%2F%3E%3Cpath%20d%3D%22M128%2024%20151%2092l70%200-56%2041%2021%2068-58-40-58%2040%2021-68-56-41h70z%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%23d9ad63%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%22128%22%20cy%3D%22128%22%20r%3D%2217%22%20fill%3D%22%23090909%22%20stroke%3D%22%23d9ad63%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E")
        center 52% / min(620px, 55vw) auto no-repeat;
      opacity: .34;
      mix-blend-mode: screen;
      filter: saturate(1.35) drop-shadow(0 0 35px rgba(181,18,27,.35));
      z-index: 0;
      pointer-events: none;
    }

    /* Lapisan gelap supaya dashboard tetap mudah dibaca. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(181,18,27,.07), transparent 34%),
        linear-gradient(rgba(0,0,0,.66), rgba(0,0,0,.78));
      z-index: 0;
      pointer-events: none;
    }

    /* Konten harus berada di atas watermark. */
    #app,
    #loginPage {
      position: relative;
      z-index: 1;
    }

    /* ==================================================
       LOADER
    ================================================== */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(181,18,27,.12),
          transparent 32%
        ),
        linear-gradient(
          rgba(0,0,0,.90),
          rgba(0,0,0,.97)
        ),
        url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff3340%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237b0710%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2244%22%20fill%3D%22%23090909%22%2F%3E%3Cpath%20d%3D%22M128%2024%20151%2092l70%200-56%2041%2021%2068-58-40-58%2040%2021-68-56-41h70z%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%23d9ad63%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%22128%22%20cy%3D%22128%22%20r%3D%2217%22%20fill%3D%22%23090909%22%20stroke%3D%22%23d9ad63%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E")
        center / 360px auto no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      transition: opacity .5s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse 2s infinite;
      filter: drop-shadow(0 0 30px rgba(181,18,27,.45));
    }

    .loader-title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .loader-subtitle {
      margin-top: 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
    }

    .loader-line {
      width: 180px;
      height: 2px;
      margin-top: 25px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: var(--red2);
      animation: loading 1.2s infinite;
    }

    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(320%); }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.05);
        opacity: .75;
      }
    }

    /* ==================================================
       LOGIN
    ================================================== */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(430px, 100%);
      padding: 38px;
      border: 1px solid var(--border);
      background: rgba(10,10,10,.82);
      backdrop-filter: blur(22px);
      border-radius: 24px;
      box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 50px rgba(181,18,27,.08);
    }

    .login-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
    }

    .login-title {
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .login-subtitle {
      text-align: center;
      margin-top: 7px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .login-form {
      margin-top: 30px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      background: rgba(255,255,255,.045);
      color: white;
      border-radius: 12px;
      padding: 13px 14px;
      transition: .2s;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(181,18,27,.75);
      box-shadow: 0 0 0 3px rgba(181,18,27,.09);
    }

    select option {
      background: #161616;
      color: white;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      color: white;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--red), #720a10);
      box-shadow: 0 8px 30px rgba(181,18,27,.2);
    }

    .btn-red {
      background: var(--red);
    }

    .btn-gold {
      background: #765a27;
    }

    .btn-green {
      background: #176c42;
    }

    .btn-danger {
      background: #76202a;
    }

    .btn-muted {
      background: #292929;
    }

    .login-error {
      display: none;
      margin-bottom: 15px;
      padding: 11px 13px;
      border-radius: 10px;
      background: rgba(239,77,90,.1);
      border: 1px solid rgba(239,77,90,.2);
      color: #ff7e88;
      font-size: 12px;
    }

    /* ==================================================
       APP
    ================================================== */

    #app {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sidebar);
      background: rgba(7,7,7,.92);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding: 23px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand-role {
      color: var(--gold);
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .nav {
      padding: 14px 10px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-section {
      color: #626262;
      font-size: 9px;
      letter-spacing: 2px;
      margin: 15px 10px 7px;
    }

    .nav-item {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a8a8a8;
      background: transparent;
      border: 0;
      border-radius: 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-item:hover {
      background: rgba(255,255,255,.045);
      color: white;
    }

    .nav-item.active {
      color: white;
      background:
        linear-gradient(
          90deg,
          rgba(181,18,27,.25),
          rgba(181,18,27,.04)
        );
      border-left: 2px solid var(--red2);
    }

    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .profile-mini {
      padding: 11px;
      margin-bottom: 8px;
      background: rgba(255,255,255,.035);
      border-radius: 10px;
    }

    .profile-mini-name {
      font-size: 12px;
      font-weight: 700;
    }

    .profile-mini-role {
      color: var(--gold);
      font-size: 9px;
      margin-top: 4px;
    }

    .logout {
      width: 100%;
      background: rgba(181,18,27,.12);
      border: 1px solid rgba(181,18,27,.2);
      color: #ff737b;
      padding: 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .main {
      margin-left: var(--sidebar);
      min-height: 100vh;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 15px;
    }

    .page-title {
      font-size: 25px;
      font-weight: 900;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .mobile-menu {
      display: none;
    }

    /* ==================================================
       CARDS
    ================================================== */

    .grid {
      display: grid;
      gap: 15px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 19px;
      backdrop-filter: blur(16px);
    }

    .stat-label {
      color: #8c8c8c;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .stat-value {
      margin-top: 9px;
      font-size: 25px;
      font-weight: 900;
    }

    .stat-red {
      color: #ed4b55;
    }

    .stat-green {
      color: #4bd58c;
    }

    .stat-gold {
      color: var(--gold);
    }

    /* ==================================================
       STOCK
    ================================================== */

    .section-title {
      margin: 28px 0 13px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .item-card {
      position: relative;
      overflow: hidden;
      min-height: 205px;
      padding: 18px;
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018) 55%, rgba(181,18,27,.035));
      border-color: rgba(255,255,255,.075);
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
    }

    .item-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--red), var(--gold), transparent);
      opacity: .9;
    }

    .item-card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      right: -45px;
      top: -45px;
      border-radius: 50%;
      background: rgba(181,18,27,.10);
      filter: blur(2px);
      pointer-events: none;
    }

    .item-card:hover {
      transform: translateY(-4px);
      border-color: rgba(201,164,92,.28);
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.022) 55%, rgba(181,18,27,.055));
      box-shadow: 0 16px 42px rgba(0,0,0,.32);
    }

    .item-top {
      display:grid;
      grid-template-columns:34px minmax(0, 1fr);
      align-items:start;
      gap:10px;
      position:relative;
      z-index:1;
      min-width:0;
    }

    .item-top .status {
      position:absolute;
      top:5px;
      right:0;
      margin-top:0;
      max-width:92px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .item-icon {
      width:34px;
      height:34px;
      flex:0 0 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:11px;
      background:rgba(181,18,27,.13);
      border:1px solid rgba(181,18,27,.2);
      color:#e34a52;
      font-size:15px;
    }

    .item-name {
      min-width:0;
      padding-right:86px;
      font-size:14px;
      line-height:1.35;
      font-weight:850;
      color:#f3f3f3;
      letter-spacing:.15px;
      overflow-wrap:normal;
      word-break:normal;
      hyphens:none;
    }

    .item-stock-label {
      margin-top:18px;
      color:#777;
      font-size:8px;
      font-weight:800;
      letter-spacing:1.4px;
      text-transform:uppercase;
      position:relative;
      z-index:1;
    }

    .item-stock {
      font-size:31px;
      line-height:1;
      font-weight:950;
      margin-top:6px;
      letter-spacing:-.7px;
      position:relative;
      z-index:1;
    }

    .item-stock-unit {
      color:#777;
      font-size:9px;
      font-weight:700;
      margin-left:5px;
      letter-spacing:.3px;
    }

    .item-min {
      color:#929292;
      font-size:9px;
      margin-top:8px;
      position:relative;
      z-index:1;
    }

    .item-footer {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:14px;
      position:relative;
      z-index:1;
    }

    .item-edit {
      flex:1;
      min-height:32px;
      padding:7px 10px !important;
      border-radius:10px !important;
      font-size:9px !important;
      letter-spacing:.4px;
      transition:.2s ease;
    }

    .item-edit:hover {
      border-color:rgba(201,164,92,.28);
      color:#fff;
    }

    .stock-toolbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding:13px;
      margin-bottom:15px;
      border:1px solid var(--border);
      border-radius:16px;
      background:rgba(18,18,18,.72);
      box-shadow:0 10px 30px rgba(0,0,0,.14);
      backdrop-filter:blur(14px);
    }

    .stock-search-wrap {
      flex:1;
      min-width:230px;
      position:relative;
    }

    .stock-search-icon {
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      color:#888;
      font-size:13px;
      pointer-events:none;
    }

    .stock-search {
      width:100%;
      min-width:0;
      border:1px solid var(--border);
      outline:none;
      background:rgba(255,255,255,.035);
      color:white;
      border-radius:11px;
      padding:12px 14px 12px 38px;
      transition:.2s;
    }

    .stock-search::placeholder { color:#707070; }
    .stock-search:focus { border-color:rgba(181,18,27,.75); box-shadow:0 0 0 3px rgba(181,18,27,.09); background:rgba(255,255,255,.055); }

    .stock-toolbar-info {
      color:#777;
      font-size:9px;
      white-space:nowrap;
    }

    .stock-count {
      color:#d0d0d0;
      font-weight:800;
    }

    .stock-empty {
      grid-column:1/-1;
      text-align:center;
      padding:42px 20px;
      color:#777;
    }

    .stock-empty b { color:#d9d9d9; }

    .status {
      display: inline-block;
      margin-top: 13px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .8px;
    }

    .available {
      background: rgba(55,201,120,.11);
      color: #4be08c;
    }

    .low {
      background: rgba(229,185,77,.11);
      color: #e8c15a;
    }

    .out {
      background: rgba(239,77,90,.11);
      color: #ff6570;
    }

    /* ==================================================
       TABLE
    ================================================== */

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      text-align: left;
      padding: 12px;
      background: rgba(255,255,255,.035);
      color: #858585;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #d7d7d7;
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(255,255,255,.02);
    }

    /* ==================================================
       MODAL
    ================================================== */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 30px 100px rgba(0,0,0,.6);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
    }

    .close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: #aaa;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* ==================================================
       TOAST
    ================================================== */

    #toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10000;
      max-width: 350px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #191919;
      border: 1px solid var(--border);
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      font-size: 12px;
      transform: translateY(120px);
      opacity: 0;
      transition: .3s;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    #toast.error {

.kasbon-person-count strong {
  display:block;
  font-size:22px;
  line-height:1;
  color:#fff;
}

.kasbon-person-count span {
  display:block;
  margin-top:5px;
  font-size:9px;
  letter-spacing:1.3px;
  color:rgba(255,255,255,.5);
}

.kasbon-form-card {
  border-color:rgba(188,25,46,.2);
}

.kasbon-person-list {
  display:grid;
  gap:18px;
}

.kasbon-person-card {
  position:relative;
  overflow:hidden;
  border:1px solid rgba(193,28,48,.28);
  border-radius:18px;
  background:
    radial-gradient(circle at 100% 0%, rgba(145,17,35,.13), transparent 35%),
    linear-gradient(145deg, rgba(17,17,21,.98), rgba(29,10,14,.96));
  box-shadow:
    0 16px 42px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.kasbon-person-card::before {
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:linear-gradient(180deg,#d52a48,#711323,transparent);
}

.kasbon-person-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:18px 20px;
  border-bottom:1px solid rgba(255,255,255,.055);
}

.kasbon-person-identity {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.kasbon-person-avatar {
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  border:1px solid rgba(196,29,49,.4);
  background:linear-gradient(145deg, rgba(130,17,33,.8), rgba(35,8,13,.95));
  color:#fff;
  font-weight:800;
  font-size:17px;
  box-shadow:0 7px 18px rgba(0,0,0,.3);
}

.kasbon-person-name {
  color:#fff;
  font-weight:800;
  font-size:15px;
  letter-spacing:.25px;
}

.kasbon-person-rank {
  margin-top:4px;
  color:rgba(255,255,255,.46);
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.kasbon-person-actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
}

.kasbon-mini-btn {
  border:1px solid rgba(255,255,255,.1);
  border-radius:9px;
  padding:8px 11px;
  background:rgba(255,255,255,.035);
  color:#eee;
  font-size:9px;
  font-weight:800;
  letter-spacing:.7px;
  cursor:pointer;
  transition:.18s ease;
}

.kasbon-mini-btn:hover {
  transform:translateY(-1px);
  background:rgba(255,255,255,.075);
}

.kasbon-mini-red {
  border-color:rgba(211,38,62,.38);
  color:#ff8292;
}

.kasbon-mini-green {
  border-color:rgba(45,180,105,.34);
  color:#79e3a8;
}

.kasbon-mini-delete {
  border-color:rgba(220,60,70,.2);
  color:rgba(255,150,160,.68);
}

.kasbon-summary-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:14px 20px;
}

.kasbon-summary {
  min-width:0;
  padding:12px 13px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:12px;
  background:rgba(255,255,255,.025);
}

.kasbon-summary span {
  display:block;
  color:rgba(255,255,255,.46);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.kasbon-summary strong {
  display:block;
  margin-top:6px;
  color:#fff;
  font-size:14px;
}

.kasbon-summary-red {
  border-color:rgba(208,37,60,.18);
}

.kasbon-summary-red strong {
  color:#ff788b;
}

.kasbon-summary-green {
  border-color:rgba(42,175,100,.17);
}

.kasbon-summary-green strong {
  color:#71dda1;
}

.kasbon-summary-gold {
  border-color:rgba(205,158,48,.18);
}

.kasbon-summary-gold strong {
  color:#e6c36d;
}

.kasbon-summary-status strong {
  margin-top:7px;
}

.kasbon-table-wrap {
  overflow-x:auto;
  border-top:1px solid rgba(255,255,255,.05);
}

.kasbon-person-table {
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

.kasbon-person-table th {
  padding:11px 14px;
  text-align:left;
  background:rgba(255,255,255,.025);
  color:rgba(255,255,255,.43);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.8px;
  white-space:nowrap;
}

.kasbon-person-table td {
  padding:12px 14px;
  border-top:1px solid rgba(255,255,255,.045);
  color:rgba(255,255,255,.78);
  font-size:11px;
  vertical-align:middle;
}

.kasbon-person-table tbody tr {
  transition:background .15s ease;
}

.kasbon-person-table tbody tr:hover {
  background:rgba(255,255,255,.025);
}

.kasbon-date {
  color:rgba(255,255,255,.56) !important;
  white-space:nowrap;
}

.kasbon-type {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 8px;
  border-radius:7px;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.type-kasbon {
  background:rgba(190,27,49,.13);
  border:1px solid rgba(208,37,60,.24);
  color:#ff7c8e;
}

.type-setoran {
  background:rgba(40,171,96,.11);
  border:1px solid rgba(40,171,96,.23);
  color:#73dda1;
}

.amount-kasbon {
  color:#ff7c8e !important;
  font-weight:800;
  white-space:nowrap;
}

.amount-setoran {
  color:#73dda1 !important;
  font-weight:800;
  white-space:nowrap;
}

.kasbon-empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:190px;
  padding:30px;
  border:1px dashed rgba(255,255,255,.12);
  border-radius:18px;
  background:rgba(255,255,255,.018);
  text-align:center;
}

.kasbon-empty-icon {
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid rgba(193,28,48,.25);
  color:#e05b70;
  font-size:24px;
}

.kasbon-empty-state strong {
  color:#fff;
  font-size:14px;
}

.kasbon-empty-state span {
  margin-top:5px;
  color:rgba(255,255,255,.43);
  font-size:11px;
}

@media (max-width: 800px) {
  .kasbon-page-head,
  .kasbon-list-head {
    align-items:flex-start;
  }

  .kasbon-summary-grid {
    grid-template-columns:repeat(2,1fr);
  }

  .kasbon-person-head {
    align-items:flex-start;
    flex-direction:column;
  }

  .kasbon-person-actions {
    width:100%;
    justify-content:flex-start;
  }

  .kasbon-mini-btn {
    flex:1;
    min-width:82px;
  }
}

@media (max-width: 520px) {
  .kasbon-page-head {
    flex-direction:column;
  }

  .kasbon-person-count {
    width:100%;
  }

  .kasbon-summary-grid {
    grid-template-columns:1fr 1fr;
    padding:12px;
  }

  .kasbon-person-head {
    padding:15px;
  }

  .kasbon-mini-btn {
    font-size:8px;
    padding:8px 7px;
  }

  .kasbon-table-wrap {
    margin:0;
  }
}



/* =====================================================
   MAGANG - KASBON READ ONLY
===================================================== */
.kasbon-readonly-head {
  align-items: center;
}

.kasbon-readonly-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid rgba(210, 180, 90, .32);
  border-radius: 999px;
  background: rgba(210, 180, 90, .08);

  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.4px;
  white-space: nowrap;
}

.kasbon-readonly-badge span {
  font-size: 8px;
  opacity: .9;
}

.kasbon-readonly-card {
  border-color: rgba(210, 180, 90, .22);
}

.kasbon-readonly-lock {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.07);
  color: rgba(255,255,255,.62);
  font-size: 10px;

  letter-spacing: 1px;
}

.kasbon-readonly-note {
  display: flex;

.kasbon-readonly-note > span {

.kasbon-readonly-note strong {

  }

/* =========================================================
   PERATURAN CRIMSON HERITAGE — SIMPLE / READABLE
========================================================= */
.rules-page {
  max-width: 980px;
  margin: 0 auto;
}

.rules-hero {
  padding: 8px 0 16px;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.10);
}

.rules-kicker {
  color: var(--mafia-gold);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.rules-heading {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  font-weight: 900;
}

.rules-desc {
  color: rgba(255,255,255,.52);
  font-size: 10px;
  line-height: 1.5;
  margin-top: 4px;
}

.rules-list {
  display: grid;
  gap: 6px;
}

.rule-card {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 11px 13px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 9px;
  background: rgba(255,255,255,.025);
  transition: background .15s ease, border-color .15s ease;
}

.rule-card:hover {
  background: rgba(181,18,27,.055);
  border-color: rgba(181,18,27,.22);
}

.rule-number {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: rgba(181,18,27,.13);
  border: 1px solid rgba(181,18,27,.22);
  color: #e7c77e;
  font-size: 11px;
  font-weight: 800;
}

.rule-text {
  color: rgba(255,255,255,.82);
  font-size: 11px;
  line-height: 1.5;
  font-weight: 600;
}

.rules-note {
  margin-top: 10px;
  padding: 9px 11px;
  border-left: 2px solid rgba(201,164,92,.55);
  color: rgba(255,255,255,.42);
  font-size: 9px;
  line-height: 1.45;
  background: rgba(255,255,255,.018);
}

@media (max-width: 750px) {
  .rules-heading {
    font-size: 21px;
  }

  .rule-card {
    grid-template-columns: 27px minmax(0, 1fr);
    gap: 9px;
    padding: 10px;
  }

  .rule-number {
    width: 26px;
    height: 26px;
    font-size: 10px;
  }

  .rule-text {
    font-size: 10.5px;
    line-height: 1.5;
  }
}

html,body,button,input,select,textarea{

.nav-item,.quick-card strong,.section-title,.page-title,.modal-title,

}
.keuangan-balance:before{

.keuangan-balance-value{

.keuangan-balance-period{

.keuangan-form-card{margin-bottom:18px}
.keuangan-tools{

  font-weight:800;
  letter-spacing:.4px;
}
.finance-in-badge{

}
.finance-out-badge{
  background:rgba(239,77,90,.12);

}
.finance-in{color:#62e39a !important;font-weight:700}

.duplicate-card{margin-top:20px;border:1px solid rgba(239,77,90,.22)}

  color:rgba(255,255,255,.72);
}
.duplicate-clean strong{color:#62e39a}
.duplicate-clean div{margin-top:5px;font-size:10px;color:rgba(255,255,255,.45)}
.duplicate-note{
  margin-bottom:14px;
  color:rgba(255,255,255,.48);
  font-size:10px;
  line-height:1.6;
}
.duplicate-pair{
  margin-top:12px;
  padding:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:rgba(255,255,255,.018);
}
.duplicate-pair-title{
  margin-bottom:9px;
  color:#c9a45c;
  font:700 10px var(--ch-display-font);
  letter-spacing:1px;
}
.duplicate-row{
  display:grid;
  grid-template-columns:1.1fr 1fr 1.2fr .8fr auto;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid rgba(255,255,255,.055);

}
.duplicate-row:first-of-type{border-top:0}
.duplicate-row strong{display:block;color:#f4f1eb}

@media(max-width:750px){
  .keuangan-balance{padding:24px 22px}
  .keuangan-balance-value{font-size:32px}
  .duplicate-row{grid-template-columns:1fr 1fr}
  .duplicate-row button{grid-column:1/-1;width:100%}
}

===================================================== */

function handleLogin(event) {

  event.preventDefault();

  const username =
    document
      .getElementById('loginUsername')
      .value;

  const password =
    document
      .getElementById('loginPassword')
      .value;

  const button =
    document
      .getElementById('loginButton');

  const error =
    document
      .getElementById('loginError');

  button.disabled = true;
  button.textContent = 'MEMERIKSA...';

  error.style.display = 'none';

  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'MASUK';

      if (!result.success) {

        error.textContent =
          result.message ||
          'Login gagal.';

        error.style.display =
          'block';

        return;

      }

      TOKEN =
        result.token;

      USER =
        result.user;

      storageSet_(
        'CH_TOKEN',
        TOKEN
      );

      openApp();

    })

    .withFailureHandler(function(err) {

      button.disabled = false;
      button.textContent = 'MASUK';

      error.textContent =
        getErrorMessage(err);

      error.style.display =
        'block';

    })

    .login(
      username,
      password
    );

}

/* =====================================================

function showPage(
  page,
  title
) {

  const protectedPermission = {
    dashboard: 'dashboard',
    stock: 'stock',
    stockin: 'masuk',
    stockout: 'keluar',
    pickup: 'pickup',
    party: 'party',
    kerjasama: 'kerjasama',
    kasbon: 'kasbon',
    finance: 'finance',
    members: 'members',
    history: 'history',
    accounts: 'accounts'
  };

  const requiredPermission = protectedPermission[page];

  if (requiredPermission && !PERMISSIONS[requiredPermission]) {
    toast('Akses ke halaman ini tidak tersedia untuk role ' + (USER && USER.role ? USER.role : '') + '.', 'error');
    return;
  }

  document
    .querySelectorAll('.nav-item')
    .forEach(function(button) {

      button.classList.toggle(
        'active',
        button.dataset.page === page
      );

    });

  document
    .getElementById('pageTitle')
    .textContent = title;

  document
    .getElementById('content')
    .innerHTML =
      loadingHTML();

  document
    .getElementById('sidebar')
    .classList.remove('open');


  switch(page) {

    case 'dashboard':
      loadDashboardPage();
      break;

    case 'stock':

      break;

    case 'stockin':
      loadStockInPage();
      break;

}

function loadStockPage() {

  google.script.run
    .withSuccessHandler(function(items) {
      CURRENT_ITEMS = items || [];
      renderStockPage_('');
    })
    .withFailureHandler(handleServerError)
    .getItemsPublic(TOKEN);
}

function renderStockPage_(query) {
  const q = String(query || '').trim().toLowerCase();
  const filtered = CURRENT_ITEMS.filter(function(item) {
    return String(item.name || '').toLowerCase().includes(q);
  });

  let cards = '';

  filtered.forEach(function(item) {
    cards += `
      <div class="card item-card" data-stock-name="${escapeAttr(item.name)}">
        <div class="item-top">
          <div class="item-icon">▣</div>
          <div class="item-name">${escapeHTML(item.name)}</div>
          ${statusBadge(item.status)}
        </div>

        <div class="item-stock-label">STOCK TERSEDIA</div>
        <div class="item-stock">${number(item.stock)}<span class="item-stock-unit">UNIT</span></div>
        <div class="item-min">Minimum stock: ${number(item.minimum)} pcs</div>

        <div class="item-footer">
          <button
            class="btn btn-muted item-edit"
            onclick='openEditItemModal(${JSON.stringify(item)})'
          >
            EDIT BARANG
          </button>
        </div>
      </div>`;
  });

  if (!cards) {
    cards = `<div class="card empty stock-empty">Barang dengan nama <b>${escapeHTML(query || '')}</b> tidak ditemukan.</div>`;
  }

  let cardsContainer = document.getElementById('stockCards');
  if (cardsContainer) {
    cardsContainer.innerHTML = cards;

    const countEl = document.getElementById('stockCount');
    if (countEl) {
      countEl.textContent = filtered.length + ' barang';
    }
    return;
  }

  document.getElementById('content').innerHTML = `
    <div class="stock-toolbar">
      <div class="stock-search-wrap">
        <span class="stock-search-icon">⌕</span>
        <input id="stockSearch" class="stock-search" type="search" placeholder="Cari nama barang..." autocomplete="off" spellcheck="false">
      </div>
      <div class="stock-toolbar-info">Menampilkan <span id="stockCount" class="stock-count">${filtered.length} barang</span></div>
      <button class="btn btn-red" onclick="openAddItemModal()">+ TAMBAH BARANG</button>
    </div>
    <div id="stockCards" class="grid grid-4">${cards}</div>`;

  const input = document.getElementById('stockSearch');
  if (input) {
    input.value = query || '';
    input.addEventListener('input', function() {
      renderStockPage_(this.value);
    });
  }
}

function submitParty() {

  const button =
    document.getElementById('partySaveButton');

  const tanggal =
    document.getElementById('partyTanggal').value;

  const nama =
    document.getElementById('partyNama').value.trim();

  const jumlah =
    document.getElementById('partyJumlah').value;

  const dpWd =
    document.getElementById('partyDpWd').value;

  const namaPJ =
    document.getElementById('partyNamaPJ').value.trim();

  const keterangan =
    document.getElementById('partyKeterangan').value.trim();

  if (!tanggal || !nama || !jumlah || !dpWd || !namaPJ) {
    toast(
      'Tanggal, Nama, Jumlah, DP/WD, dan Nama PJ wajib diisi.',
      'error'
    );
    return;
  }

  button.disabled = true;
  button.textContent = 'MENYIMPAN...';

  google.script.run
    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'SIMPAN EVENT';

      toast(
        result.message || 'Data Event berhasil disimpan.',
        'success'
      );

      loadPartyPage();

    })
    .withFailureHandler(function(err) {

      button.disabled = false;
      button.textContent = 'SIMPAN EVENT';

      handleServerError(err);

    })
    .addParty(
      TOKEN,
      keterangan,
      namaPJ,
      tanggal,
      nama,
      jumlah,
      dpWd
    );
}

function renderKasbonMagangReadOnly(balances, history) {

  const row = balances && balances.length
    ? balances[0]
    : null;

  const memberHistory = history || [];

  let rows = '';

  memberHistory.forEach(function(item) {

    const isKasbon =
      String(item.type || '').toUpperCase() === 'KASBON';

    rows += `
      <tr>
        <td class="kasbon-date">
          ${escapeHTML(item.timestamp || '-')}
        </td>

        <td>
          <span class="kasbon-type ${isKasbon ? 'type-kasbon' : 'type-setoran'}">
            ${isKasbon ? 'KASBON' : 'SETORAN'}
          </span>
        </td>

        <td class="${isKasbon ? 'amount-kasbon' : 'amount-setoran'}">
          ${isKasbon ? '+' : '-'} ${money(item.amount)}
        </td>

        <td>
          ${escapeHTML(item.keterangan || '-')}
        </td>

        <td>
          ${escapeHTML(item.nama || '-')}
        </td>
      </tr>
    `;
  });

  if (!rows) {
    rows = `
      <tr>
        <td colspan="5">
          <div class="empty">
            Belum ada riwayat Kasbon & Setoran.
          </div>
        </td>
      </tr>
    `;
  }

  const name = row && row.memberName
    ? row.memberName
    : (USER && USER.nama ? USER.nama : 'Saya');

  const rank = row && row.rank
    ? row.rank
    : 'MAGANG';

  const totalKasbon = row ? Number(row.totalKasbon) || 0 : 0;

function loadKasbonPage() {

  Promise.all([
    getKasbonPromise(),
    getKasbonHistoryPromise()
  ])
  .then(function(results) {

    const balances = results[0] || [];
    const history = results[1] || [];

    // MAGANG hanya mendapatkan halaman baca-saja miliknya sendiri.
    // Backend sudah memfilter data berdasarkan session.memberId.
    if (USER && String(USER.role).toUpperCase() === 'MAGANG') {
      renderKasbonMagangReadOnly(balances, history);
      return;
    }

    let kasbonOptions = '';
    let setoranOptions = '';

    balances.forEach(function(row) {

      kasbonOptions += `
        <option value="${escapeAttr(row.memberId)}">
          ${escapeHTML(row.memberName)}
          — Sisa ${money(row.remaining)}
        </option>
      `;

      if (Number(row.remaining) > 0) {
        setoranOptions += `
          <option value="${escapeAttr(row.memberId)}"
                  data-remaining="${Number(row.remaining)}">
            ${escapeHTML(row.memberName)}
            — Sisa ${money(row.remaining)}
          </option>
        `;
      }

    });

    if (!setoranOptions) {
      setoranOptions = `
        <option value="" disabled selected>
          Tidak ada kasbon yang bisa disetor
        </option>
      `;
    }

    /*
     * Satu member = satu tabel.
     * Hanya member yang benar-benar memiliki kasbon yang ditampilkan.
     */
    const activeBalances = balances.filter(function(row) {
      return Number(row.totalKasbon) > 0;
    });

    window.__KASBON_BALANCES = balances;

    const grouped = {};

    activeBalances.forEach(function(row) {
      grouped[String(row.memberId)] = {
        balance: row,
        history: []
      };
    });

    history.forEach(function(row) {
      const key = String(row.memberId);
      if (grouped[key]) {
        grouped[key].history.push(row);
      }
    });

    let memberTables = '';

    activeBalances.forEach(function(row) {

      const key = String(row.memberId);
      const memberData = grouped[key];
      const memberHistory = memberData.history || [];

      let rows = '';

      memberHistory.forEach(function(item) {

        const isKasbon =
          String(item.type || '').toUpperCase() === 'KASBON';

        rows += `
          <tr>
            <td class="kasbon-date">
              ${escapeHTML(item.timestamp || '-')}
            </td>

            <td>
              <span class="kasbon-type ${isKasbon ? 'type-kasbon' : 'type-setoran'}">
                ${isKasbon ? 'KASBON' : 'SETORAN'}
              </span>
            </td>

            <td class="${isKasbon ? 'amount-kasbon' : 'amount-setoran'}">
              ${isKasbon ? '+' : '-'} ${money(item.amount)}
            </td>

            <td>
              ${escapeHTML(item.keterangan || '-')}
            </td>

            <td>
              ${escapeHTML(item.nama || '-')}
            </td>
          </tr>
        `;

      });

      if (!rows) {
        rows = `
          <tr>
            <td colspan="5">
              <div class="empty">
                Belum ada riwayat transaksi.
              </div>
            </td>
          </tr>
        `;
      }

      memberTables += `
        <section class="kasbon-person-card">

          <div class="kasbon-person-head">

            <div class="kasbon-person-identity">
              <div class="kasbon-person-avatar">
                ${escapeHTML(
                  String(row.memberName || '?')
                    .trim()
                    .charAt(0)
                    .toUpperCase()
                )}
              </div>

              <div>
                <div class="kasbon-person-name">
                  ${escapeHTML(row.memberName)}
                </div>

                <div class="kasbon-person-rank">
                  ${escapeHTML(row.rank || 'MEMBER')}
                </div>
              </div>
            </div>

            <div class="kasbon-person-actions">
              <button
                class="kasbon-mini-btn kasbon-mini-red"
                onclick="focusKasbonMember('${escapeAttr(row.memberId)}')"
                type="button"
              >
                + KASBON
              </button>

              ${
                Number(row.remaining) > 0
                  ? `
                    <button
                      class="kasbon-mini-btn kasbon-mini-green"
                      onclick="focusSetoranMember('${escapeAttr(row.memberId)}')"
                      type="button"
                    >
                      + SETORAN
                    </button>
                  `
                  : ''
              }

              <button
                class="kasbon-mini-btn kasbon-mini-delete"
                onclick="deleteKasbonPerson('${escapeAttr(row.memberId)}')"
                type="button"
              >
                HAPUS
              </button>
            </div>

          </div>

          <div class="kasbon-summary-grid">

            <div class="kasbon-summary kasbon-summary-red">
              <span>Total Kasbon</span>
              <strong>${money(row.totalKasbon)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-green">
              <span>Total Setoran</span>
              <strong>${money(row.totalSetoran)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-gold">
              <span>Sisa</span>
              <strong>${money(row.remaining)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-status">
              <span>Status</span>
              <strong>${statusBadge(row.status)}</strong>
            </div>

          </div>

          <div class="kasbon-table-wrap">

            <table class="kasbon-person-table">

              <thead>
                <tr>
                  <th>Waktu</th>
                  <th>Jenis</th>
                  <th>Nominal</th>
                  <th>Keterangan</th>
                  <th>Dicatat Oleh</th>
                </tr>
              </thead>

              <tbody>
                ${rows}
              </tbody>

            </table>

          </div>

        </section>
      `;

    });

    if (!memberTables) {
      memberTables = `
        <div class="kasbon-empty-state">
          <div class="kasbon-empty-icon">◇</div>
          <strong>Belum ada kasbon</strong>
          <span>
            Belum ada member yang memiliki data kasbon.
          </span>
        </div>
      `;
    }

    document
      .getElementById('content')
      .innerHTML = `

      <div class="kasbon-page-head">

        <div>
          <div class="section-title" style="margin-top:0">
            KASBON & SETORAN
          </div>

          <div class="kasbon-page-subtitle">
            Kelola transaksi berdasarkan masing-masing member.
          </div>
        </div>

        <div class="kasbon-person-count">
          <strong>${activeBalances.length}</strong>
          <span>MEMBER KASBON</span>
        </div>

      </div>

      <div class="grid grid-2">

        <div class="card kasbon-form-card">

          <div class="section-title" style="margin-top:0">
            CATAT KASBON
          </div>

          <div class="field">
            <label>Member</label>

            <select id="kasbonMember">
              ${kasbonOptions || `
                <option value="" disabled selected>
                  Belum ada member
                </option>
              `}
            </select>
          </div>

          <div class="field">
            <label>Nominal</label>

            <input
              id="kasbonAmount"
              type="number"
              min="1"
              placeholder="0"
            >

          <div class="field">
            <label>Keterangan</label>

            <textarea id="kasbonNote"></textarea>
          </div>

          <button
            class="btn btn-red"

            SIMPAN KASBON
          </button>

        </div>

        <div class="card kasbon-form-card">

          <div class="section-title" style="margin-top:0">
            CATAT SETORAN
          </div>

          <div class="field">
            <label>Member</label>

            <select
              id="setoranMember"
              onchange="updateSetoranLimit()"
            >
              ${setoranOptions}
            </select>
          </div>

          <div class="field">
            <label>Nominal</label>

            <input
              id="setoranAmount"
              type="number"
              min="1"
              step="1"
              placeholder="0"
              oninput="validateSetoranAmount()"
            >

            <div id="setoranLimit" class="field-hint"></div>
          </div>

          <div class="field">
            <label>Keterangan</label>

            <textarea id="setoranNote"></textarea>
          </div>

          <button
            id="setoranButton"
            class="btn btn-green"
            onclick="submitSetoran()"
            type="button"
          >
            SIMPAN SETORAN
          </button>

        </div>

      </div>

      <div class="kasbon-list-head">
        <div>
          <div class="section-title" style="margin:0">
            DATA PER MEMBER
          </div>
          <div class="kasbon-list-desc">
            Setiap member memiliki tabel transaksi sendiri.
          </div>
        </div>
      </div>

      <div class="kasbon-person-list">
        ${memberTables}
      </div>

    `;

    updateSetoranLimit();

  })
  .catch(handleServerError);

}


function focusKasbonMember(memberId) {

  const select = document.getElementById('kasbonMember');

  if (!select) return;

  select.value = String(memberId);

  const amount = document.getElementById('kasbonAmount');

  if (amount) {
    amount.focus();
    amount.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

}


function focusSetoranMember(memberId) {

  const select = document.getElementById('setoranMember');

  if (!select) return;

  select.value = String(memberId);
  updateSetoranLimit();

  const amount = document.getElementById('setoranAmount');

  if (amount) {
    amount.focus();
    amount.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

}


function deleteKasbonPerson(memberId) {

  const balances = window.__KASBON_BALANCES || [];

  const row = balances.find(function(item) {
    return String(item.memberId) === String(memberId);
  });

  const memberName =
    row && row.memberName
      ? row.memberName
      : 'member ini';

  if (!confirm(
    'Hapus seluruh tabel Kasbon & Setoran untuk "' +
    memberName +
    '"?\n\n' +
    'Semua transaksi kasbon dan setoran milik member ini akan dihapus dari sheet. ' +
    'Tindakan ini tidak dapat dibatalkan.'
  )) {
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {

      toast(
        result.message || 'Data kasbon berhasil dihapus.',
        'success'
      );

      loadKasbonPage();

    })
    .withFailureHandler(handleServerError)
    .deleteKasbonPerson(
      TOKEN,
      memberId
    );

}


function submitKasbon() {

  google.script.run

    .withSuccessHandler(function(result) {

      toast(
        result.message ||
        'Kasbon berhasil.',
        'success'
      );

      loadKasbonPage();

    })

    .withFailureHandler(handleServerError)

    .addKasbon(
      TOKEN,
      document.getElementById('kasbonMember').value,
      document.getElementById('kasbonAmount').value,
      document.getElementById('kasbonNote').value,
      USER.nama
    );

}


function updateSetoranLimit() {
  const select = document.getElementById('setoranMember');
  const amount = document.getElementById('setoranAmount');
  const hint = document.getElementById('setoranLimit');
  const button = document.getElementById('setoranButton');

  if (!select || !amount || !hint || !button) return;

  const option = select.options[select.selectedIndex];
  const remaining = Number(option && option.dataset.remaining) || 0;

  amount.max = remaining > 0 ? String(remaining) : '';
  hint.textContent = remaining > 0
    ? 'Maksimal setoran: ' + money(remaining)
    : 'Tidak ada sisa kasbon.';

  validateSetoranAmount();
}

function validateSetoranAmount() {
  const select = document.getElementById('setoranMember');
  const amount = document.getElementById('setoranAmount');
  const button = document.getElementById('setoranButton');

  if (!select || !amount || !button) return false;

  const option = select.options[select.selectedIndex];
  const remaining = Number(option && option.dataset.remaining) || 0;
  const value = Number(amount.value) || 0;

  const valid = remaining > 0 && value > 0 && value <= remaining;
  button.disabled = !valid;

  if (value > remaining && remaining > 0) {
    amount.setCustomValidity('Nominal melebihi sisa kasbon.');
  } else {
    amount.setCustomValidity('');
  }

  return valid;
}

function submitSetoran() {

  if (!validateSetoranAmount()) {
    toast('Nominal setoran melebihi sisa kasbon atau belum diisi.', 'error');
    return;
  }

  const button = document.getElementById('setoranButton');
  button.disabled = true;
  button.textContent = 'MENYIMPAN...';

  google.script.run
    .withSuccessHandler(function(result) {
      toast(
        result.message || 'Setoran berhasil.',
        'success'
      );
      loadKasbonPage();
    })
    .withFailureHandler(function(err) {
      button.disabled = false;
      button.textContent = 'SIMPAN SETORAN';
      handleServerError(err);
      loadKasbonPage();
    })
    .addSetoran(
      TOKEN,
      document.getElementById('setoranMember').value,
      document.getElementById('setoranAmount').value,
      document.getElementById('setoranNote').value,
      USER.nama
    );

}

function submitKeuangan() {

  const type = document.getElementById('financeType').value;

  if (!amount || Number(amount) <= 0) {
    toast('Nominal harus lebih dari 0.', 'error');
    return;

  if (!String(note || '').trim()) {
    toast('Keterangan wajib diisi.', 'error');
    return;

  google.script.run
    .withSuccessHandler(function(result) {
      toast(result.message || 'Transaksi berhasil disimpan.', 'success');
      loadFinancePage();
    })
    .withFailureHandler(handleServerError)
    .addKeuanganTransaction(
      TOKEN,
      type,
      amount,
      note
    );
}

function cekDuplikatKeuangan() {

  const box = document.getElementById('keuanganDuplicateBox');

  if (box) {
    box.innerHTML = '<div class="card"><div class="empty">MEMERIKSA DATA...</div></div>';
  }

  google.script.run
    .withSuccessHandler(function(list) {

      list = list || [];

      if (!box) return;

      if (!list.length) {
        box.innerHTML = `
          <div class="card duplicate-clean">
            <strong>✓ TIDAK ADA KANDIDAT DUPLIKAT</strong>
            <div>Semua transaksi yang diperiksa tidak menunjukkan pasangan yang sama.</div>
          </div>
        `;
        return;
      }

      let html = `
        <div class="card duplicate-card">
          <div class="section-title" style="margin-top:0">
            ⚠ KANDIDAT DATA DUPLIKAT
          </div>
          <div class="duplicate-note">
            Sistem hanya menandai data yang sama jenis, nominal, keterangan,
            input oleh, dan tercatat dalam rentang 24 jam. Kamu tetap menentukan
            transaksi mana yang benar-benar salah.
          </div>
      `;

      list.forEach(function(pair, index) {

        function duplicateRow(item) {
          return `
            <div class="duplicate-row">
              <div>
                <strong>${escapeHTML(item.id)}</strong>
                <span>${escapeHTML(item.tanggal)}</span>
              </div>
              <div>${escapeHTML(item.jenis)} • ${money(item.nominal)}</div>
              <div>${escapeHTML(item.keterangan)}</div>
              <div>${escapeHTML(item.inputOleh)}</div>
              <button class="btn btn-muted" onclick="deleteKeuangan('${escapeAttr(item.id)}')">
                HAPUS ${escapeHTML(item.id)}
              </button>
            </div>
          `;
        }

        html += `
          <div class="duplicate-pair">
            <div class="duplicate-pair-title">PASANGAN ${index + 1}</div>
            ${duplicateRow(pair.first)}
            ${duplicateRow(pair.second)}
          </div>
        `;
      });

      html += '</div>';
      box.innerHTML = html;
    })
    .withFailureHandler(handleServerError)
    .getKeuanganDuplicateCandidates(TOKEN);
}

===================================================== */

function loadHistoryPage() {

  Promise.all([
    getHistoryPromise(),
    getPickupHistoryPromise()
  ])
  .then(function(results) {

    const transactions = results[0];
    const pickups = results[1];

    let rows = '';

    transactions.forEach(function(row) {

      rows += `
        <tr>

          <td>${escapeHTML(row.timestamp)}</td>

          <td>${escapeHTML(row.type)}</td>

          <td>${escapeHTML(row.itemName)}</td>

          <td>${number(row.qty)}</td>

          <td>${escapeHTML(row.memberName || '-')}</td>

          <td>${escapeHTML(row.staffName || '-')}</td>

          <td>${escapeHTML(row.keterangan || '-')}</td>

        </tr>
      `;

    });

    document
      .getElementById('content')
      .innerHTML = `

      <div class="section-title" style="margin-top:0">
        TRANSACTION HISTORY
      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Waktu</th>
              <th>Tipe</th>
              <th>Barang</th>
              <th>Qty</th>
              <th>Member</th>
              <th>Staff</th>
              <th>Keterangan</th>

            </tr>

          </thead>

          <tbody>

            ${rows || `
              <tr>
                <td colspan="7">
                  <div class="empty">
                    Belum ada transaksi.
                  </div>
                </td>
              </tr>
            `}

          </tbody>

        </table>

      </div>


      <div class="section-title">
        PICKUP / PENGAMBILAN
      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Waktu</th>
              <th>Member</th>
              <th>Barang</th>
              <th>Qty</th>
              <th>Staff</th>
              <th>Status</th>
              <th>Aksi</th>

            </tr>

          </thead>

          <tbody>

            ${pickups.map(function(row) {

              return `
                <tr>

                  <td>${escapeHTML(row.timestamp)}</td>

                  <td>${escapeHTML(row.memberName)}</td>

                  <td>${escapeHTML(row.itemName)}</td>

                  <td>${number(row.qty)}</td>

                  <td>${escapeHTML(row.staffName)}</td>

                  <td>${statusBadge(row.status)}</td>

                  <td>

                    ${
                      row.status === 'PENDING'
                      ? `
                        <button
                          class="btn btn-green"
                          style="padding:7px 9px;font-size:9px"
                          onclick="processPickup('${escapeAttr(row.id)}')"
                        >
                          PROSES
                        </button>

                        <button
                          class="btn btn-danger"
                          style="padding:7px 9px;font-size:9px"
                          onclick="cancelPickup('${escapeAttr(row.id)}')"
                        >
                          BATAL
                        </button>
                      `
                      : '-'
                    }

                  </td>

                </tr>
              `;

            }).join('')}

          </tbody>

        </table>

      </div>

    `;

  })
  .catch(handleServerError);

}

function changePassword() {

  const oldPassword =
    document.getElementById(
      'oldPassword'
    ).value;

  const newPassword =
    document.getElementById(
      'newPassword'
    ).value;

  const confirm =
    document.getElementById(
      'confirmPassword'
    ).value;

  if (newPassword !== confirm) {

    toast(
      'Konfirmasi password tidak sama.',
      'error'
    );

    return;

  }

  google.script.run

    .withSuccessHandler(function(result) {

      toast(
        result.message ||
        'Password berhasil diubah.',
        'success'
      );

      document
        .getElementById('oldPassword')
        .value = '';

      document
        .getElementById('newPassword')
        .value = '';

      document
        .getElementById('confirmPassword')
        .value = '';

    })

    .withFailureHandler(handleServerError)

    .changeMyPassword(
      TOKEN,
      oldPassword,
      newPassword
    );

}

/* =====================================================
   PARTNERSHIP
===================================================== */

let CURRENT_PARTNERS = [];
let CURRENT_PARTNER = null;

function loadPartnershipPage() {
  google.script.run
    .withSuccessHandler(function(partners) {
      CURRENT_PARTNERS = partners || [];
      renderPartnershipPage_();
    })
    .withFailureHandler(handleServerError)
    .getPartners(TOKEN);
}

function renderPartnershipPage_() {
  let list = '';
  CURRENT_PARTNERS.forEach(function(partner) {
    const active = CURRENT_PARTNER && CURRENT_PARTNER.id === partner.id ? ' active' : '';
    list += `<button class="card partner-card${active}" onclick="selectPartner('${escapeAttr(partner.id)}')">
      <div class="partner-name">${escapeHTML(partner.name)}</div>
      <div class="partner-meta">${escapeHTML(partner.status)} • Mulai ${escapeHTML(formatDateSimple_(partner.startDate))}</div>
    </button>`;
  });
  if (!list) list = `<div class="card empty">Belum ada partner. Tambahkan partner sesuai perjanjian kerja sama.</div>`;

  document.getElementById('content').innerHTML = `
    <div class="partnership-toolbar">
      <div>
        <div style="font-size:12px;color:#888">DAFTAR PARTNER</div>
        <div style="font-size:10px;color:#666;margin-top:4px">Partner aktif bisa dipilih untuk mencatat transaksi dua arah.</div>
      </div>
      <button class="btn btn-red" onclick="openAddPartnerModal()">+ TAMBAH PARTNER</button>
    </div>
    <div class="partnership-list">${list}</div>
    ${CURRENT_PARTNER ? partnershipDetailHTML_(CURRENT_PARTNER) : `
      <div class="card empty">Pilih partner untuk melihat dan mencatat Partnership.</div>
    `}`;
}

function formatDateSimple_(value) {
  if (!value) return '-';
  const p = String(value).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : value;
}

function selectPartner(id) {
  const partner = CURRENT_PARTNERS.find(function(p) { return String(p.id) === String(id); });
  if (!partner) return;
  CURRENT_PARTNER = partner;
  renderPartnershipPage_();
  refreshPartnerPurchases_();
}

function partnershipDetailHTML_(partner) {
  const disabled = String(partner.status).toUpperCase() === 'NONAKTIF' ? 'disabled' : '';
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div>
          <div style="font-size:17px;font-weight:900">${escapeHTML(partner.name)}</div>
          <div style="font-size:9px;color:#888;margin-top:5px">PARTNER ID: ${escapeHTML(partner.id)} • MULAI: ${escapeHTML(formatDateSimple_(partner.startDate))}</div>
          ${partner.note ? `<div style="font-size:10px;color:#777;margin-top:6px">${escapeHTML(partner.note)}</div>` : ''}
        </div>
        <div style="display:flex;gap:7px">
          ${statusBadge(partner.status)}
          <button class="btn btn-muted" style="padding:7px 10px;font-size:9px" onclick="openEditPartnerModal('${escapeAttr(partner.id)}')">EDIT</button>
          <button class="btn btn-danger" style="padding:7px 10px;font-size:9px" onclick="deletePartnerConfirm('${escapeAttr(partner.id)}')">HAPUS</button>
        </div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:15px">
      <div class="partnership-direction">
        <h3>📦 PEMBELIAN KITA <span style="color:#777;font-weight:400">— barang dari partner</span></h3>
        <div class="grid grid-2">
          <div class="field"><label>Nama Barang</label><input id="pbItem" placeholder="Contoh: Air Mineral" ${disabled}></div>
          <div class="field"><label>Jumlah</label><input id="pbQty" type="number" min="1" placeholder="0" ${disabled}></div>
          <div class="field"><label>Tanggal</label><input id="pbDate" type="date" ${disabled}></div>
          <div class="field"><label>Keterangan</label><input id="pbNote" placeholder="Opsional" ${disabled}></div>
        </div>
        <button class="btn btn-red" onclick="savePartnerPurchase('BUY')" ${disabled}>SIMPAN PEMBELIAN KITA</button>
        <div id="partnerBuyHistory" style="margin-top:14px"></div>
      </div>

      <div class="partnership-direction">
        <h3>🛒 PEMBELIAN MEREKA <span style="color:#777;font-weight:400">— barang dari Crimson Heritage</span></h3>
        <div class="grid grid-2">
          <div class="field"><label>Nama Item Crimson Heritage</label><input id="psItem" placeholder="Contoh: Produk A" ${disabled}></div>
          <div class="field"><label>Jumlah</label><input id="psQty" type="number" min="1" placeholder="0" ${disabled}></div>
          <div class="field"><label>Tanggal</label><input id="psDate" type="date" ${disabled}></div>
          <div class="field"><label>Keterangan</label><input id="psNote" placeholder="Opsional" ${disabled}></div>
        </div>
        <button class="btn btn-gold" onclick="savePartnerPurchase('SELL')" ${disabled}>SIMPAN PEMBELIAN MEREKA</button>
        <div id="partnerSellHistory" style="margin-top:14px"></div>
      </div>
    </div>`;
}

function refreshPartnerPurchases_() {
  if (!CURRENT_PARTNER) return;
  google.script.run.withSuccessHandler(function(data) {
    const buy = data && data.buy ? data.buy : [];
    const sell = data && data.sell ? data.sell : [];
    const buyEl = document.getElementById('partnerBuyHistory');
    const sellEl = document.getElementById('partnerSellHistory');
    if (buyEl) buyEl.innerHTML = purchaseHistoryHTML_(buy, 'Belum ada pembelian kita.');
    if (sellEl) sellEl.innerHTML = purchaseHistoryHTML_(sell, 'Belum ada pembelian mereka.');
  }).withFailureHandler(handleServerError).getPartnershipPurchases(TOKEN, CURRENT_PARTNER.id);
}

function purchaseHistoryHTML_(rows, emptyText) {
  if (!rows.length) return `<div style="font-size:9px;color:#666;padding:10px 0">${emptyText}</div>`;
  return `<div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Item</th><th>Qty</th><th>Tanggal</th><th>Keterangan</th></tr></thead><tbody>` +
    rows.map(function(r) { return `<tr><td>${escapeHTML(r.itemName)}</td><td>${number(r.qty)}</td><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.note || '-')}</td></tr>`; }).join('') +
    `</tbody></table></div>`;
}

function savePartnerPurchase(direction) {
  if (!CURRENT_PARTNER) return;
  const prefix = direction === 'BUY' ? 'pb' : 'ps';
  const item = document.getElementById(prefix + 'Item').value;
  const qty = document.getElementById(prefix + 'Qty').value;
  const date = document.getElementById(prefix + 'Date').value;
  const note = document.getElementById(prefix + 'Note').value;
  google.script.run.withSuccessHandler(function(result) {
    toast(result.message || 'Data berhasil disimpan.', 'success');
    ['Item','Qty','Date','Note'].forEach(function(k){ const el=document.getElementById(prefix+k); if(el) el.value=''; });
    refreshPartnerPurchases_();
  }).withFailureHandler(handleServerError).addPartnershipPurchase(TOKEN, direction, CURRENT_PARTNER.id, item, qty, date, note);
}

function openAddPartnerModal() {
  openModal('TAMBAH PARTNER', `
    <div class="field"><label>Nama Partner / Bisnis</label><input id="partnerName" placeholder="Contoh: Bisnis A"></div>
    <div class="field"><label>Tanggal Mulai Partnership</label><input id="partnerStart" type="date"></div>
    <div class="field"><label>Status</label><select id="partnerStatus"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div>
    <div class="field"><label>Catatan Perjanjian</label><textarea id="partnerNote" placeholder="Catatan singkat perjanjian..." ></textarea></div>
    <div class="modal-actions"><button class="btn btn-muted" onclick="closeModal()">BATAL</button><button class="btn btn-red" onclick="savePartner()">TAMBAH PARTNER</button></div>`);
}

function savePartner() {
  google.script.run.withSuccessHandler(function(result) {
    closeModal(); toast(result.message || 'Partner berhasil ditambahkan.', 'success'); CURRENT_PARTNER = null; loadPartnershipPage();
  }).withFailureHandler(handleServerError).addPartner(TOKEN,
    document.getElementById('partnerName').value,
    document.getElementById('partnerStart').value,
    document.getElementById('partnerStatus').value,
    document.getElementById('partnerNote').value);
}

function openEditPartnerModal(id) {
  const p = CURRENT_PARTNERS.find(function(x){return x.id===id;});
  if (!p) return;
  openModal('EDIT PARTNER', `
    <div class="field"><label>Nama Partner / Bisnis</label><input id="partnerEditName" value="${escapeAttr(p.name)}"></div>
    <div class="field"><label>Tanggal Mulai Partnership</label><input id="partnerEditStart" type="date" value="${escapeAttr(p.startDate)}"></div>
    <div class="field"><label>Status</label><select id="partnerEditStatus"><option value="AKTIF" ${p.status==='AKTIF'?'selected':''}>AKTIF</option><option value="NONAKTIF" ${p.status==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div>
    <div class="field"><label>Catatan Perjanjian</label><textarea id="partnerEditNote">${escapeHTML(p.note || '')}</textarea></div>
    <div class="modal-actions"><button class="btn btn-muted" onclick="closeModal()">BATAL</button><button class="btn btn-red" onclick="saveEditPartner('${escapeAttr(id)}')">SIMPAN</button></div>`);
}

function saveEditPartner(id) {
  google.script.run.withSuccessHandler(function(result) {
    closeModal(); toast(result.message || 'Partner berhasil diperbarui.', 'success');
    CURRENT_PARTNER = null; loadPartnershipPage();
  }).withFailureHandler(handleServerError).updatePartner(TOKEN,id,
    document.getElementById('partnerEditName').value,
    document.getElementById('partnerEditStart').value,
    document.getElementById('partnerEditStatus').value,
    document.getElementById('partnerEditNote').value);
}

function deletePartnerConfirm(id) {
  const p = CURRENT_PARTNERS.find(function(x){return x.id===id;});
  if (!p) return;
  if (!confirm('Hapus partner "' + p.name + '"? Riwayat pembelian tetap disimpan, tetapi partner tidak lagi muncul di daftar.')) return;
  google.script.run.withSuccessHandler(function(result) {
    toast(result.message || 'Partner berhasil dihapus.', 'success'); CURRENT_PARTNER=null; loadPartnershipPage();
  }).withFailureHandler(handleServerError).deletePartner(TOKEN,id);
}

function runPromise(
  functionName,
  args
) {

  return new Promise(function(resolve, reject) {

    let runner =
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

    runner[functionName].apply(
      runner,
      args
    );

  });

}

  className
) {

        ${label}
      </div>

      <div class="stat-value ${className}">
        ${value}
      </div>

    </div>

function itemCard(item) {

  return `
    <div class="card item-card">

      <div class="item-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="item-stock">
        ${number(item.stock)}
      </div>

      <div class="item-min">
        Minimum: ${number(item.minimum)}
      </div>

      ${statusBadge(item.status)}

    </div>
  `;

}


function statusBadge(status) {

  const value =
    String(status || '')
      .toUpperCase();

  let cls = 'available';

  if (
    value.includes('OUT') ||
    value === 'INACTIVE' ||
    value === 'CANCELLED'
  ) {

    cls = 'out';

  } else if (
    value.includes('LOW') ||
    value === 'PENDING' ||
    value === 'BELUM LUNAS'
  ) {

    cls = 'low';

  } else if (
    value === 'ACTIVE' ||
    value === 'AVAILABLE' ||
    value === 'LUNAS' ||
    value === 'PROCESSED' ||
    value === 'PEMASUKAN'
  ) {

    cls = 'available';

  } else if (
    value === 'PENGELUARAN'
  ) {

    cls = 'out';

  }

  return `
    <span class="status ${cls}">
      ${escapeHTML(value || '-')}
    </span>
  `;

}


function loadingHTML() {

  return `

      <div class="empty">

}

      );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function toast(
  message,
  type
) {

  const el =
    document.getElementById(
      'toast'
    );

  el.textContent =
    message;

  el.className =
    'show ' +
    (type || '');

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(function() {

      el.className = '';

    }, 3500);

}


/* =====================================================
   ERROR
===================================================== */

function handleServerError(err) {
  const message = getErrorMessage(err);

  if (isSessionError_(message)) {
    forceLogout_('Sesi berakhir. Silakan login kembali.');
    return;
  }

  toast(message || 'Terjadi kesalahan.', 'error');
}


function isSessionError_(message) {
  const text = String(message || '').toUpperCase();
  // ACCESS_DENIED bukan berarti session expired.
  // Jangan logout user hanya karena permission menu/fungsi ditolak.
  return text.includes('SESSION_REQUIRED') ||
         text.includes('SESSION_EXPIRED');
}

function forceLogout_(message) {
  TOKEN = '';
  USER = null;
  storageRemove_('CH_TOKEN');
  showLogin();

  const error = document.getElementById('loginError');
  if (error && message) {
    error.textContent = message;
    error.style.display = 'block';
  }
}

function getErrorMessage(err) {

  if (!err) {
    return 'Terjadi kesalahan.';
  }

  if (typeof err === 'string') {
    return err;
  }

  return (
    err.message ||
    'Terjadi kesalahan pada server.'
  );

}


/* =====================================================
   FORMATTING
===================================================== */

function money(value) {

  return 'Rp ' +
    Number(value || 0)
      .toLocaleString(
        'id-ID'
      );

}


function number(value) {

  return Number(value || 0)
    .toLocaleString(
      'id-ID'
    );

}


/* =====================================================
   SECURITY / ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttr(value) {

  return escapeHTML(value);

}


/* =====================================================
   CLOSE MODAL ON BACKDROP
===================================================== */

document
  .getElementById('modal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );

</script>

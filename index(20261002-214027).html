<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crimson Heritage</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0b0b0d;color:#eee}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 15%,#431116 0,#130b0d 38%,#080809 75%)}.card{width:min(420px,100%);padding:34px;border:1px solid #4d2025;border-radius:24px;background:#111114;box-shadow:0 25px 80px #000}.brand{text-align:center;margin-bottom:25px}.brand b{font-size:28px;letter-spacing:4px}.brand span{display:block;color:#a9a9ae;font-size:11px;letter-spacing:3px;margin-top:7px}.field{margin:13px 0}.field label{font-size:12px;color:#aaa;display:block;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #34343a;background:#19191e;color:#fff;outline:none}.btn{border:0;border-radius:12px;padding:13px 16px;background:#a91625;color:#fff;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.12)}.full{width:100%}.app{display:flex;min-height:100vh}.side{width:240px;background:#101013;border-right:1px solid #29292e;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.side h2{letter-spacing:3px;font-size:18px;margin:4px 10px 30px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:12px 14px;border-radius:11px;cursor:pointer}.nav button.active,.nav button:hover{background:#271114;color:#fff}.logout{margin-top:25px;width:100%;background:#19191e;border:1px solid #333;color:#ddd}.main{margin-left:240px;width:calc(100% - 240px);padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:25px;font-weight:800}.sub{font-size:12px;color:#888;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#111114;border:1px solid #29292e;border-radius:18px;padding:18px}.stat small{color:#888}.stat strong{display:block;font-size:25px;margin-top:7px}.panel{margin-top:16px;overflow:auto}.panel h3{margin:0 0 14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #25252a;white-space:nowrap}.table th{color:#999}.actions{display:flex;gap:8px;flex-wrap:wrap}.mini{padding:8px 11px;font-size:12px}.danger{background:#5d1820}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(600px,100%);background:#121216;border:1px solid #3a2528;border-radius:20px;padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{min-height:20px;color:#ef727d;font-size:12px;margin:10px 0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#291317;color:#ff8992;font-size:11px}
@media(max-width:800px){.side{width:75px;padding:15px 8px}.side h2{font-size:0}.side h2:after{content:'CH';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{margin-left:75px;width:calc(100% - 75px);padding:16px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.title{font-size:20px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.card{padding:25px}.main{padding:12px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="brand"><b>CRIMSON HERITAGE</b><span>MANAGEMENT SYSTEM</span></div><div class="field"><label>USERNAME</label><input id="username" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div><div id="loginMsg" class="msg"></div><button class="btn full" onclick="login()">MASUK</button></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>CRIMSON</h2><div class="nav"><button onclick="page('dashboard')">⌂ &nbsp; Dashboard</button><button onclick="page('items')">▣ &nbsp; Barang</button><button onclick="page('pickup')">↥ &nbsp; Pengambilan</button><button onclick="page('finance')">Rp &nbsp; Keuangan</button><button onclick="page('members')">♙ &nbsp; Members</button><button onclick="page('history')">☷ &nbsp; History</button><button onclick="page('event')">◆ &nbsp; Event</button><button onclick="page('users')">⚙ &nbsp; Users</button></div><button class="btn logout" onclick="logout()">LOGOUT</button></aside><main class="main"><div class="top"><div><div id="title" class="title">Dashboard</div><div id="sub" class="sub">CRIMSON HERITAGE</div></div><span id="who" class="badge"></span></div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h3 id="mtitle"></h3><button class="btn mini" onclick="closeModal()">Tutup</button></div><div id="mbody"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwWnLGFTUzg-nK5klwKDF9UkjFz8iEnRdiLXdq5Mo2gIb4LUBj6jFbN3a2hbKnAA5bkog/exec';
let TOKEN=localStorage.getItem('CH_TOKEN')||'',USER=null;
function call(method,args={}){return new Promise((resolve,reject)=>{const cb='ch_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const finish=(x,e)=>{if(done)return;done=true;clearTimeout(t);s.remove();delete window[cb];e?reject(e):resolve(x)};window[cb]=x=>finish(x);const t=setTimeout(()=>finish(null,new Error('Koneksi ke Apps Script timeout. Cek URL Web App dan deployment.')),15000);s.onerror=()=>finish(null,new Error('Gagal terhubung ke Apps Script.'));s.src=API_URL+'?api=1&method='+encodeURIComponent(method)+'&args='+encodeURIComponent(JSON.stringify({...args,token:TOKEN}))+'&callback='+cb;document.body.appendChild(s)})}
async function login(){const m=document.getElementById('loginMsg');m.textContent='Memeriksa...';try{const r=await call('login',{username:username.value,password:password.value});if(!r.success){m.textContent=r.message;return}TOKEN=r.token;USER=r.user;localStorage.setItem('CH_TOKEN',TOKEN);showApp();page('dashboard')}catch(e){m.textContent=e.message}}
async function logout(){await call('logout',{}).catch(()=>{});TOKEN='';USER=null;localStorage.removeItem('CH_TOKEN');location.reload()}
async function showApp(){if(!USER){const r=await call('profile');if(!r.success){TOKEN='';localStorage.removeItem('CH_TOKEN');return}USER=r.user}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=USER.username+' • '+USER.role}
async function page(p){document.getElementById('content').innerHTML='<div class="panel">Memuat...</div>';const title=p.charAt(0).toUpperCase()+p.slice(1);document.getElementById('title').textContent=title;try{if(p==='dashboard')return renderDashboard(await call('dashboard'));if(p==='items')return renderItems(await call('items'));if(p==='members')return renderMembers(await call('members'));if(p==='history')return renderHistory(await call('history',{limit:100}));if(p==='finance')return renderFinance(await call('finance'));if(p==='pickup')return renderPickup(await call('pickupList'));if(p==='event')return renderEvent(await call('eventList'));if(p==='users')return renderUsers(await call('users'));}catch(e){document.getElementById('content').innerHTML='<div class="panel">'+e.message+'</div>'}}
function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function renderDashboard(r){document.getElementById('content').innerHTML=`<div class="grid"><div class="stat"><small>SALDO SAAT INI</small><strong>${money(r.stats.balance)}</strong></div><div class="stat"><small>BARANG</small><strong>${r.stats.items}</strong></div><div class="stat"><small>MEMBERS</small><strong>${r.stats.members}</strong></div><div class="stat"><small>STOCK MINIMUM</small><strong>${r.stats.lowStock}</strong></div></div><div class="panel"><h3>Selamat datang</h3><p style="color:#aaa">Website ini menggunakan GitHub Pages sebagai frontend, Google Apps Script sebagai backend, dan Google Spreadsheet sebagai database.</p></div>`}
function table(headers,rows){return `<div class="panel"><table class="table"><thead><tr>${headers.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows||'<tr><td colspan="20">Tidak ada data</td></tr>'}</tbody></table></div>`}
function renderItems(r){document.getElementById('content').innerHTML=`<div class="actions"><button class="btn mini" onclick="openItem()">+ Tambah Barang</button><button class="btn mini" onclick="openStock('in')">+ Barang Masuk</button><button class="btn mini danger" onclick="openStock('out')">− Barang Keluar</button></div>`+table(['ID','BARANG','STOCK','STATUS'],r.items.map(x=>`<tr><td>${x.ITEM_ID}</td><td>${x.NAMA_BARANG}</td><td>${x.STOCK}</td><td>${x.STATUS}</td></tr>`).join(''))}
function renderMembers(r){document.getElementById('content').innerHTML=`<div class="actions"><button class="btn mini" onclick="openMember()">+ Tambah Member</button></div>`+table(['ID','NAMA','PANGKAT','STATUS','TRANSAKSI','QTY'],r.members.map(x=>`<tr><td>${x.MEMBER_ID}</td><td>${x.NAMA}</td><td>${x.PANGKAT}</td><td>${x.STATUS}</td><td>${x.TOTAL_TRANSAKSI}</td><td>${x.TOTAL_QTY}</td></tr>`).join(''))}
function renderHistory(r){document.getElementById('content').innerHTML=table(['WAKTU','TYPE','BARANG','QTY','MEMBER','STAFF'],r.history.map(x=>`<tr><td>${x.TIMESTAMP||''}</td><td>${x.TYPE}</td><td>${x.ITEM_NAME}</td><td>${x.QTY}</td><td>${x.MEMBER_NAME||'-'}</td><td>${x.STAFF_NAME||'-'}</td></tr>`).join(''))}
function renderFinance(r){document.getElementById('content').innerHTML=`<div class="actions"><button class="btn mini" onclick="openFinance()">+ Catat Keuangan</button></div>`+table(['WAKTU','TYPE','NOMINAL','KETERANGAN','NAMA'],r.finance.map(x=>`<tr><td>${x.TIMESTAMP||''}</td><td>${x.TYPE}</td><td>${money(x.AMOUNT)}</td><td>${x.KETERANGAN}</td><td>${x.NAMA}</td></tr>`).join(''))}
function renderPickup(r){document.getElementById('content').innerHTML=`<div class="actions"><button class="btn mini" onclick="openPickup()">+ Pengambilan</button></div>`+table(['ID','MEMBER','BARANG','QTY','PENYERAH','STATUS'],r.pickups.map(x=>`<tr><td>${x.PICKUP_ID}</td><td>${x.MEMBER_NAME}</td><td>${x.ITEM_NAME}</td><td>${x.QTY}</td><td>${x.STAFF_NAME}</td><td>${x.STATUS} ${(['ADMIN','STAFF'].includes(USER.role)&&x.STATUS==='PENDING'?`<button class="btn mini" onclick="approve('${x.PICKUP_ID}')">ACC</button>`:'')}</td></tr>`).join(''))}
function renderEvent(r){document.getElementById('content').innerHTML=`<div class="actions"><button class="btn mini" onclick="openEvent()">+ Tambah Event</button></div>`+table(['ID','KETERANGAN','PJ','TANGGAL','NAMA','JUMLAH'],r.events.map(x=>`<tr><td>${x.PARTY_ID}</td><td>${x.KETERANGAN}</td><td>${x.NAMA_PJ}</td><td>${x.TANGGAL}</td><td>${x.NAMA}</td><td>${money(x.JUMLAH)}</td></tr>`).join(''))}
function renderUsers(r){document.getElementById('content').innerHTML=table(['USERNAME','NAMA','ROLE','STATUS'],r.users.map(x=>`<tr><td>${x.USERNAME}</td><td>${x.NAMA}</td><td>${x.ROLE}</td><td>${x.STATUS}</td></tr>`).join(''))}
function openModal(title,html){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')};function closeModal(){document.getElementById('modal').classList.add('hidden')}
function formField(id,label,type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" ${extra}></div>`}
function openItem(){openModal('Tambah Barang',formField('iname','Nama Barang')+formField('istock','Stock','number')+formField('imin','Minimum Stock','number')+`<button class="btn full" onclick="saveItem()">SIMPAN</button>`)}
async function saveItem(){const r=await call('addItem',{name:iname.value,stock:istock.value,minStock:imin.value});alert(r.message);if(r.success){closeModal();page('items')}}
function openStock(t){openModal(t==='in'?'Barang Masuk':'Barang Keluar',formField('iid','ITEM ID')+formField('iqty','QTY','number')+formField('inote','Keterangan')+`<button class="btn full" onclick="saveStock('${t}')">SIMPAN</button>`)}
async function saveStock(t){const r=await call(t==='in'?'stockIn':'stockOut',{itemId:iid.value,qty:iqty.value,note:inote.value,name:USER.name});alert(r.message);if(r.success){closeModal();page('items')}}
function openMember(){openModal('Tambah Member',formField('mname','Nama')+formField('mrank','Pangkat')+`<button class="btn full" onclick="saveMember()">SIMPAN</button>`)}
async function saveMember(){const r=await call('addMember',{name:mname.value,rank:mrank.value});alert(r.message);if(r.success){closeModal();page('members')}}
function openFinance(){openModal('Catat Keuangan',`<div class="field"><label>JENIS</label><select id="ftype"><option>PEMASUKAN</option><option>PENGELUARAN</option></select></div>`+formField('famount','Nominal','number')+formField('fnote','Keterangan')+`<button class="btn full" onclick="saveFinance()">SIMPAN</button>`)}
async function saveFinance(){const r=await call('addFinance',{type:ftype.value,amount:famount.value,note:fnote.value,name:USER.name});alert(r.message);if(r.success){closeModal();page('finance')}}
function openPickup(){openModal('Pengambilan',formField('pmember','Member ID')+formField('pname','Nama Member')+formField('pitem','Item ID')+formField('pitemname','Nama Barang')+formField('pqty','Qty','number')+formField('phid','ID Penyerah')+formField('phname','Nama Penyerah')+formField('pnote','Keterangan')+`<button class="btn full" onclick="savePickup()">KIRIM PENGAMBILAN</button>`)}
async function savePickup(){const r=await call('createPickup',{memberId:pmember.value,memberName:pname.value,itemId:pitem.value,itemName:pitemname.value,qty:pqty.value,handoverId:phid.value,handoverName:phname.value,note:pnote.value});alert(r.message);if(r.success){closeModal();page('pickup')}}
async function approve(id){const r=await call('approvePickup',{pickupId:id});alert(r.message);page('pickup')}
function openEvent(){openModal('Tambah Event',formField('enote','Keterangan')+formField('epic','Nama PJ')+formField('edate','Tanggal','date')+formField('ename','Nama')+formField('eamount','Jumlah','number')+formField('edp','DP / WD')+`<button class="btn full" onclick="saveEvent()">SIMPAN</button>`)}
async function saveEvent(){const r=await call('addEvent',{note:enote.value,pic:epic.value,date:edate.value,name:ename.value,amount:eamount.value,dpWd:edp.value,createdBy:USER.name});alert(r.message);if(r.success){closeModal();page('event')}}
(async()=>{if(TOKEN){try{const r=await call('profile');if(r.success){USER=r.user;showApp();page('dashboard')}}catch(e){}}})();
</script></body></html>
